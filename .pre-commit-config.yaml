# Use the project lock file for the same tools as CI and make quality.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --locked mypy src/markdown2docx
        language: system
        pass_filenames: false
        types: [python]
      - id: bandit
        name: Security checks
        entry: uv run --locked bandit -q -r src scripts skills/markdown-to-docx/scripts
        language: system
        pass_filenames: false
        types: [python]
      - id: check-yaml
        name: Validate YAML
        entry: uv run --locked check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: Validate TOML
        entry: uv run --locked check-toml
        language: system
        types: [toml]
      - id: check-json
        name: Validate JSON
        entry: uv run --locked check-json
        language: system
        types: [json]
      - id: check-merge-conflict
        name: Reject merge conflicts
        entry: uv run --locked check-merge-conflict
        language: system
        types: [text]
      - id: trailing-whitespace
        name: Trailing whitespace
        entry: uv run --locked trailing-whitespace-fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: File endings
        entry: uv run --locked end-of-file-fixer
        language: system
        types: [text]
      - id: debug-statements
        name: Debug statements
        entry: uv run --locked debug-statement-hook
        language: system
        types: [python]
      - id: check-added-large-files
        name: Large files
        entry: uv run --locked check-added-large-files
        language: system
