[project]
name = "markdown2docx"
version = "0.2.0"
description = "Convert Markdown files to DOCX format with modern standards support"
authors = [
    {name = "markdown2docx contributors"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = ["markdown", "docx", "pandoc", "conversion", "document"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "pypandoc>=1.15",
    "python-docx>=1.2.0",
    "lxml>=6.1.3",  # For better XML processing
    "packaging>=26.3",  # For version comparison
    "pyyaml>=6.0.2",  # For YAML config file support
    "fonttools>=4.60",
    "regex>=2025.9.18",
    "filelock>=4.0.12",
    "langcodes>=3.5",
]

[project.urls]
Homepage = "https://github.com/cnkang/markdown2docx"
Repository = "https://github.com/cnkang/markdown2docx"
Issues = "https://github.com/cnkang/markdown2docx/issues"

[project.scripts]
markdown2docx = "markdown2docx.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.2.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
    "hypothesis>=6.168.3",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20260518",
    "bandit>=1.9.4",
    "pre-commit-hooks>=6.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=5.1.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.5.0",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests",
    "cli: marks tests as CLI tests",
    "template: marks tests as template tests",
    "slow: marks tests as slow running",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/markdown2docx"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pypandoc.*",
    "docx.*",
    "lxml.*",
]
ignore_missing_imports = true
