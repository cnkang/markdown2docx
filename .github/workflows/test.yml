name: Test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --locked --group dev --group test
      - run: make quality
      - run: uv run --locked pre-commit run --all-files
  test:
    needs: quality
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Install checksum-pinned Pandoc
        run: uv run --locked python scripts/install_pandoc.py --github-env
      - name: Prepare verified fonts before offline tests
        run: uv run --locked python scripts/prepare_fonts.py
      - name: Run regression and mixed-language tests
        run: uv run --locked pytest --cov=src --cov-branch --cov-report=xml --cov-report=term-missing
      - name: Validate the comprehensive Markdown fixture
        run: uv run --locked python scripts/validate_multilingual.py --offline --output-dir artifacts/multilingual
      - name: Install rendering dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils fontconfig
      - name: Install verified fixture fonts in the disposable Linux runner
        if: runner.os == 'Linux'
        run: |
          uv run --locked python - <<'PY'
          import json, shutil
          from pathlib import Path
          report = json.loads(Path('artifacts/multilingual/report.json').read_text())
          destination = Path.home() / '.local/share/fonts/markdown2docx'
          destination.mkdir(parents=True, exist_ok=True)
          for font in report['fonts']:
              assert font['verified'], font
              shutil.copy2(font['path'], destination / Path(font['path']).name)
          PY
          fc-cache -f
      - name: Render and verify expected PDF fonts
        if: runner.os == 'Linux'
        run: uv run --locked python scripts/validate_multilingual.py --offline --render --output-dir artifacts/multilingual
      - name: Build distribution and test installed wheel
        run: |
          uv build --out-dir artifacts/dist
          uv venv artifacts/wheel-env --python 3.14
          if [ "$RUNNER_OS" = "Windows" ]; then
            WHEEL_PYTHON="artifacts/wheel-env/Scripts/python.exe"
          else
            WHEEL_PYTHON="artifacts/wheel-env/bin/python"
          fi
          uv pip install --python "$WHEEL_PYTHON" artifacts/dist/*.whl
          uv run --locked python scripts/validate_wheel.py --python "$WHEEL_PYTHON"
      - name: Upload DOCX, report and Linux page previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multilingual-${{ runner.os }}
          path: |
            artifacts/multilingual/
            artifacts/dist/
            coverage.xml
          if-no-files-found: warn
