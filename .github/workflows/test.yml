name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Install pinned Pandoc
        run: |
          uv run python - <<'PY'
          import os, platform
          from pathlib import Path
          import pypandoc
          target = Path('.tools').absolute()
          target.mkdir(exist_ok=True)
          assets = {
              'Windows': 'pandoc-3.12-windows-x86_64.zip',
              'Darwin': 'pandoc-3.12-arm64-macOS.zip' if platform.machine() == 'arm64' else 'pandoc-3.12-x86_64-macOS.zip',
              'Linux': 'pandoc-3.12-linux-amd64.tar.gz',
          }
          url = 'https://github.com/jgm/pandoc/releases/download/3.12/' + assets[platform.system()]
          pypandoc.download_pandoc(url=url, version='3.12', targetfolder=str(target), delete_installer=True)
          binary = target / ('pandoc.exe' if os.name == 'nt' else 'pandoc')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'PYPANDOC_PANDOC={binary}\n')
          PY
      - name: Check source formatting and types
        run: |
          uv run black --check src scripts/validate_multilingual.py tests/test_fonts.py tests/test_multilingual.py
          uv run isort --check-only src scripts/validate_multilingual.py tests/test_fonts.py tests/test_multilingual.py
          uv run mypy src/markdown2docx
      - name: Run regression and mixed-language tests
        run: uv run pytest --cov=src --cov-report=xml
      - name: Validate the comprehensive Markdown fixture
        run: uv run python scripts/validate_multilingual.py --output-dir artifacts/multilingual
      - name: Install rendering dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils fontconfig
      - name: Install verified fixture fonts in the disposable Linux runner
        if: runner.os == 'Linux'
        run: |
          uv run python - <<'PY'
          import json, shutil
          from pathlib import Path
          report = json.loads(Path('artifacts/multilingual/report.json').read_text())
          destination = Path.home() / '.local/share/fonts/markdown2docx'
          destination.mkdir(parents=True, exist_ok=True)
          for font in report['fonts']:
              assert font['verified'], font
              shutil.copy2(font['path'], destination / Path(font['path']).name)
          PY
          fc-cache -f
      - name: Render and verify expected PDF fonts
        if: runner.os == 'Linux'
        run: uv run python scripts/validate_multilingual.py --offline --render --output-dir artifacts/multilingual
      - name: Upload DOCX, report and Linux page previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multilingual-${{ runner.os }}
          path: |
            artifacts/
            coverage.xml
          if-no-files-found: warn
