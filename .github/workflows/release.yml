name: Publish distribution

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Approved publishing environment (configure Trusted Publishing first)
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      release_ref:
        description: Reviewed immutable release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: require-release-tag
        name: Require a release tag
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          RUN_REF: ${{ github.ref_name }}
          RUN_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vX.Y.Z release tag"
            exit 1
          fi
          if [ "$RUN_REF_TYPE" != "tag" ] || [ "$RUN_REF" != "$RELEASE_REF" ]; then
            echo "Dispatch this workflow on the reviewed release tag itself"
            exit 1
          fi
  test:
    needs: validate-release
    uses: ./.github/workflows/test.yml
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - id: setup-uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.6"
      - id: download-test-evidence
        name: Download validated Linux distribution evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence-Linux
          path: artifacts/evidence
      - id: copy-distribution
        name: Reuse the validated distribution artifacts
        run: |
          shopt -s nullglob
          wheels=(artifacts/evidence/artifacts/dist/*.whl)
          sdists=(artifacts/evidence/artifacts/dist/*.tar.gz)
          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 )); then
            echo "Expected exactly one wheel and one sdist in the Linux evidence" >&2
            exit 1
          fi
          mkdir dist
          cp -- "${wheels[0]}" "${sdists[0]}" dist/
      - id: verify-distributions
        name: Verify tag version and distributions
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: uv run --locked python scripts/validate_wheel.py --dist-dir dist --expected-version "${RELEASE_REF#v}" --validate-only
      - id: distribution-artifacts
        name: Upload required distribution artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: distribution
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.repository }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - id: download-distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution
          path: dist/
      - id: attest-distribution
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - id: publish-testpypi
        name: Publish to TestPyPI
        if: inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: https://test.pypi.org/legacy/
      - id: publish-pypi
        name: Publish to PyPI
        if: inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
